<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Keel Skills authorization model: a four-step test deciding whether an agent acts freely or needs explicit L3 approval">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6e7781"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="558" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <rect x="200" y="36" width="280" height="44" rx="8" fill="#eef1f4" stroke="#afb8c1"/>
  <text x="340" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Acción que escribe o cambia algo</text>
  <line x1="340" y1="80" x2="340" y2="104" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="44" y="106" width="372" height="56" rx="8" fill="#eef1f4" stroke="#afb8c1"/>
  <text x="60" y="130" font-size="14" font-weight="600" fill="#1f2328">1 · ¿Read-only, análisis o</text>
  <text x="60" y="150" font-size="14" font-weight="600" fill="#1f2328">borrador [PROPUESTA]?</text>
  <line x1="416" y1="134" x2="452" y2="134" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="456" y="106" width="184" height="56" rx="8" fill="#dafbe1" stroke="#2da44e"/>
  <text x="548" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">Libre</text>
  <text x="548" y="148" text-anchor="middle" font-size="12" fill="#1a7f37">actuá</text>
  <text x="240" y="178" text-anchor="middle" font-size="12" fill="#57606a">no</text>
  <line x1="230" y1="162" x2="230" y2="190" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="44" y="192" width="372" height="56" rx="8" fill="#eef1f4" stroke="#afb8c1"/>
  <text x="60" y="216" font-size="14" font-weight="600" fill="#1f2328">2 · ¿Toca una zona caliente?</text>
  <text x="60" y="236" font-size="12" fill="#57606a">prod · datos · cliente · irreversible</text>
  <line x1="416" y1="220" x2="452" y2="220" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="456" y="192" width="184" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="548" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">L3</text>
  <text x="548" y="234" text-anchor="middle" font-size="12" fill="#cf222e">aprobación explícita</text>
  <text x="240" y="264" text-anchor="middle" font-size="12" fill="#57606a">no</text>
  <line x1="230" y1="248" x2="230" y2="276" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="44" y="278" width="372" height="56" rx="8" fill="#eef1f4" stroke="#afb8c1"/>
  <text x="60" y="302" font-size="14" font-weight="600" fill="#1f2328">3 · ¿Estructural o acumulativo?</text>
  <text x="60" y="322" font-size="12" fill="#57606a">arma o reconfigura un sistema</text>
  <line x1="416" y1="306" x2="452" y2="306" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="456" y="278" width="184" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="548" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">L3</text>
  <text x="548" y="320" text-anchor="middle" font-size="12" fill="#cf222e">aprobación explícita</text>
  <text x="240" y="350" text-anchor="middle" font-size="12" fill="#57606a">no</text>
  <line x1="230" y1="334" x2="230" y2="362" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="44" y="364" width="372" height="56" rx="8" fill="#eef1f4" stroke="#afb8c1"/>
  <text x="60" y="388" font-size="14" font-weight="600" fill="#1f2328">4 · Reversible + interno + aislado</text>
  <text x="60" y="408" font-size="12" fill="#57606a">+ bajo impacto</text>
  <line x1="416" y1="392" x2="452" y2="392" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="456" y="364" width="184" height="56" rx="8" fill="#dafbe1" stroke="#2da44e"/>
  <text x="548" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">Libre</text>
  <text x="548" y="406" text-anchor="middle" font-size="12" fill="#1a7f37">actuá y reportá</text>

  <rect x="44" y="448" width="596" height="44" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="340" y="475" text-anchor="middle" font-size="14" font-weight="600" fill="#7d4e00">Ante cualquier duda, en cualquier paso → L3</text>

  <rect x="44" y="512" width="13" height="13" rx="3" fill="#dafbe1" stroke="#2da44e"/>
  <text x="63" y="523" font-size="12" fill="#57606a">Libre = actúa solo</text>
  <rect x="210" y="512" width="13" height="13" rx="3" fill="#ffebe9" stroke="#cf222e"/>
  <text x="229" y="523" font-size="12" fill="#57606a">L3 = pide aprobación</text>
  <rect x="404" y="512" width="13" height="13" rx="3" fill="#eef1f4" stroke="#afb8c1"/>
  <text x="423" y="523" font-size="12" fill="#57606a">paso de decisión</text>
</svg>
